<app-modal [open]="open()" [title]="title()" (close)="cancel.emit()">
  <div modalBody>
    <p class="confirm-message">{{ message() }}</p>
  </div>
  <div modalFooter>
    <button type="button" class="btn btn-reset" (click)="cancel.emit()" [attr.autofocus]="autofocusCancel() ? '' : null">{{ cancelLabel() }}</button>
    <button
      type="button"
      class="btn"
      [class.btn-danger]="danger()"
      [class.btn-query]="!danger()"
      (click)="confirm.emit()"
      [attr.autofocus]="!autofocusCancel() ? '' : null">
      {{ confirmLabel() }}
    </button>
  </div>
</app-modal>

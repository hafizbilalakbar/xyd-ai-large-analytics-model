<app-modal [open]="open()" [title]="title()" [maxWidth]="420" (close)="cancel.emit()">
  <div modalBody>
    <p class="confirm-message">{{ message() }}</p>
  </div>
  <div modalFooter class="confirm-actions">
    <button type="button" class="btn btn-reset" (click)="cancel.emit()">{{ cancelLabel() }}</button>
    <button
      type="button"
      class="btn"
      [class.btn-danger]="danger()"
      [class.btn-query]="!danger()"
      [disabled]="confirmDisabled()"
      (click)="confirm.emit()">
      {{ confirmLabel() }}
    </button>
  </div>
</app-modal>

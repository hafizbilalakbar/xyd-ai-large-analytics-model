<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  style="width: var(--icon-size); height: var(--icon-size)"
  aria-hidden="true"
  focusable="false"
>
  @for (path of paths(); track $index) {
    <path [attr.d]="path" />
  }
</svg>

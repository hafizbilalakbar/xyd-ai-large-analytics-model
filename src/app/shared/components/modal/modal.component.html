@if (open()) {
  <div
    class="modal-overlay"
    [class.modal-overlay--fullscreen]="mobileFullscreen()"
    (click)="onBackdropClick()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="titleId">
    <div
      #dialog
      class="modal"
      [class.modal--md]="size() === 'md'"
      [class.modal--lg]="size() === 'lg'"
      [class.modal--xl]="size() === 'xl'"
      [class.modal--mobile-fullscreen]="mobileFullscreen()"
      [style.--modal-max-width]="maxWidth() !== null ? maxWidth() + 'px' : null"
      (click)="$event.stopPropagation()">
      <div class="modal__header">
        <h2 [id]="titleId" class="modal__title">{{ title() }}</h2>
        <button
          type="button"
          class="modal__close"
          (click)="onCloseClick()"
          aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="modal__body">
        <ng-content select="[modalBody]"></ng-content>
      </div>
      @if (footerVisible()) {
        <div class="modal__footer" [class.modal__footer--compact]="compactFooter()">
          <ng-content select="[modalFooter]"></ng-content>
        </div>
      }
    </div>
  </div>
}

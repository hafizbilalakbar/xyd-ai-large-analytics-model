<div class="modes-card">
  <div class="modes-card__header">
    <h2 class="modes-card__title">Failure Mode Types</h2>
    <button type="button" class="btn btn-primary" (click)="onAddClick()">
      <span>+ Add Failure Mode</span>
    </button>
  </div>

  <div class="modes-toolbar">
    <div class="toolbar-left">
      <div class="filter-chips" role="radiogroup" aria-label="Filter by status">
        <button
          type="button"
          class="chip"
          [class.chip--active]="statusFilter() === 'all'"
          (click)="setStatusFilter('all')">
          All <span class="chip-count">{{ allCount() }}</span>
        </button>
        <button
          type="button"
          class="chip"
          [class.chip--active]="statusFilter() === 'enabled'"
          (click)="setStatusFilter('enabled')">
          Enabled <span class="chip-count">{{ enabledCount() }}</span>
        </button>
        <button
          type="button"
          class="chip"
          [class.chip--active]="statusFilter() === 'disabled'"
          (click)="setStatusFilter('disabled')">
          Disabled <span class="chip-count">{{ disabledCount() }}</span>
        </button>
      </div>

      <div class="type-select-wrap">
        <label for="failure-mode-type-filter" class="sr-only">Filter by type</label>
        <select
          id="failure-mode-type-filter"
          class="type-select"
          [ngModel]="typeFilter()"
          (ngModelChange)="onTypeFilterChange($event)">
          <option value="all">All Types</option>
          <option value="built-in">Built-in</option>
          <option value="custom">Custom</option>
        </select>
      </div>
    </div>

    <div class="toolbar-right">
      <div class="search-input-wrap">
        <app-icon name="search" [size]="14" class="search-icon" />
        <input
          type="text"
          class="search-input"
          placeholder="Search code, name, or description..."
          [ngModel]="search()"
          (ngModelChange)="onSearchChange($event)"
          aria-label="Search failure modes" />
      </div>
    </div>
  </div>

  <div class="modes-card__body">
    <app-failure-mode-table />
  </div>
</div>

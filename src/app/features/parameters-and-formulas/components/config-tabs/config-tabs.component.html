<div class="config-tabs-nav" role="tablist" aria-label="Configuration tabs">
  @for (tab of tabs; track tab.id) {
    <button
      #tabBtn
      type="button"
      role="tab"
      class="config-tab-item"
      [class.config-tab-item--active]="activeTab() === tab.id"
      [attr.aria-selected]="activeTab() === tab.id"
      [attr.tabindex]="activeTab() === tab.id ? 0 : -1"
      (click)="selectTab(tab.id)">
      {{ tab.label }}
    </button>
  }
</div>

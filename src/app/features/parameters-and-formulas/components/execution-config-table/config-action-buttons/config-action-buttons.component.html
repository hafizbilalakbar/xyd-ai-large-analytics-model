<div class="config-action-buttons" role="group" aria-label="Configuration actions">
  <button
    type="button"
    class="btn btn-nav config-btn"
    [class.disabled]="isOnly()"
    title="Edit configuration"
    (click)="emitEdit()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-3.293-3.293a2.121 2.121 0 0 1-3-3V6a2 2 0 0 1 2-2h7z" />
    </svg>
    Edit
  </button>
  <button
    type="button"
    class="btn btn-nav config-btn"
    title="Copy configuration"
    (click)="emitCopy()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
      <path d="M5 15h14" />
    </svg>
    Copy
  </button>
  @if (!isOnly()) {
    <button
      type="button"
      class="btn btn-nav config-btn"
      title="Delete configuration"
      (click)="emitDelete()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 6h18" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4" />
      </svg>
      Delete
    </button>
  } @else {
    <span class="btn btn-nav config-btn" title="Cannot delete - only configuration">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
      </svg>
      <span>Only one</span>
    </span>
  }
</div>

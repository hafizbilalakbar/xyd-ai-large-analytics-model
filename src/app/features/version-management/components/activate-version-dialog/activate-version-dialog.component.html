<app-modal
  [open]="open()"
  size="md"
  [maxWidth]="560"
  [mobileFullscreen]="true"
  [footerVisible]="true"
  [compactFooter]="true"
  [title]="title"
  (close)="onCancel()">
  <div modalBody>
    <p class="dialog-message">
      After activating <strong>{{ version() }}</strong
      >, subsequent locking judgments will use this version. In-progress locking is not affected.
      The current version stops being used for subsequent judgments.
    </p>
  </div>

  <div modalFooter>
    <button
      type="button"
      class="btn btn--secondary"
      [disabled]="pending()"
      (click)="onCancel()">
      Cancel
    </button>
    <button
      type="button"
      class="btn btn--primary"
      [disabled]="pending()"
      [attr.aria-busy]="pending()"
      (click)="onConfirm()">
      @if (pending()) {
        <span class="spinner" aria-hidden="true"></span>
      }
      {{ pending() ? 'Activating…' : 'Confirm activation' }}
    </button>
  </div>
</app-modal>

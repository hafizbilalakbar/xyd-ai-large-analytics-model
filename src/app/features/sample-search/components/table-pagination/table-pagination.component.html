<div class="pagination">
  <div class="pagination__summary">
    <span>
      Total {{ totalCount() }} items, showing {{ from() }}–{{ to() }}. Items per page:
    </span>
    <select
      class="page-size-select"
      [value]="pageSize()"
      (change)="onPageSizeChange($event)"
      aria-label="Items per page">
      @for (opt of pageSizeOptions; track opt) {
        <option [value]="opt">{{ opt }}</option>
      }
    </select>
  </div>

  <div class="pagination__controls">
    <button
      type="button"
      class="btn btn-nav"
      [disabled]="isFirstPage()"
      (click)="pageChange.emit(currentPage() - 1)"
      aria-label="Previous page">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"></path>
      </svg>
    </button>

    @for (p of displayedPages(); track p.value) {
      @if (p.ellipsis) {
        <span class="pagination__ellipsis">…</span>
      } @else {
        <button
          type="button"
          class="btn btn-nav"
          [class.active]="p.value === currentPage()"
          (click)="goToPage(p.value)"
          [attr.aria-label]="'Go to page ' + p.value"
          [attr.aria-current]="p.value === currentPage() ? 'page' : null">
          {{ p.value }}
        </button>
      }
    }

    <button
      type="button"
      class="btn btn-nav"
      [disabled]="isLastPage()"
      (click)="pageChange.emit(currentPage() + 1)"
      aria-label="Next page">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6"></path>
      </svg>
    </button>
  </div>
</div>

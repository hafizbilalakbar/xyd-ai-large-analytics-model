<div class="ms-root">
  <button
    type="button"
    class="ms-trigger"
    [class.open]="open()"
    [disabled]="disabled()"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()">
    <span class="ms-summary">{{ displayText() }}</span>
    <span class="ms-caret">&#9662;</span>
  </button>

  @if (open()) {
    <div
      class="ms-popup"
      [class.upward]="popupUpward()"
      role="listbox"
      tabindex="-1"
      (keydown)="onKeydown($event)">
      <div class="ms-popup-header">
        <span class="ms-count">{{ selectedCountText() }}</span>
        <button
          type="button"
          class="ms-clear"
          [disabled]="value().length === 0"
          (click)="clear($event)"
          aria-label="Clear all selections">
          Clear
        </button>
      </div>
      <div class="ms-popup-body">
        @if (options().length > 0) {
          @for (opt of options(); track opt.key) {
            <label
              class="ms-opt"
              [class.on]="isSelected(opt.key)"
              [class.focused]="focusedIndex() === $index"
              (click)="$event.stopPropagation()">
              <input
                type="checkbox"
                class="ms-opt-box"
                [checked]="isSelected(opt.key)"
                (change)="onChange(opt.key, $event)"
                [disabled]="disabled()"
                [attr.aria-label]="opt.label">
              <span class="ms-opt-label">{{ opt.label }}</span>
            </label>
          }
        } @else {
          <span class="ms-empty">No options available</span>
        }
      </div>
    </div>
  }
</div>

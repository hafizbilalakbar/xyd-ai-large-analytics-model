<div class="sample-search-page">
  <app-page-header
    title="Sample Query"
    subtitle="Search historical lock records based on criteria."
  >
    <div class="page-header__actions">
      <span class="page-header__result">There were <strong>{{ totalCount() }}</strong> results.</span>
    </div>
  </app-page-header>

  <app-sample-filter-panel
    (query)="onQuery()"
    (reset)="onReset()"
    [filterOptions]="filterOptions()">
  </app-sample-filter-panel>

  <app-sample-results-table
    [results]="results()"
    [totalCount]="totalCount()"
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [loading]="isLoading()"
    [errorMessage]="errorMessage()"
    (retry)="onQuery()"
    (pageChange)="setPage($event)"
    (pageSizeChange)="setPageSize($event)">
  </app-sample-results-table>
</div>

<article class="chart">
  <header class="chart__head">
    <div>
      <h3 class="chart__title">Torque-angle curve</h3>
      <p class="chart__subtitle">Latest lock</p>
    </div>
    <span class="chart__unit">N·m / °</span>
  </header>

  @if (geometry().points.length > 0) {
    <div class="chart__canvas">
      <svg
        viewBox="0 0 640 280"
        role="img"
        aria-label="Torque-angle curve for the latest locked sample"
      >
        @for (tick of geometry().yTicks; track tick.label) {
          <line
            class="chart__grid"
            [attr.x1]="geometry().plotLeft"
            [attr.y1]="tick.position"
            [attr.x2]="geometry().plotRight"
            [attr.y2]="tick.position"
          ></line>
          <text
            class="chart__axis"
            [attr.x]="geometry().plotLeft - 10"
            [attr.y]="tick.position + 4"
            text-anchor="end"
          >
            {{ tick.label }}
          </text>
        }

        @for (tick of geometry().xTicks; track tick.label) {
          <text
            class="chart__axis"
            [attr.x]="tick.position"
            [attr.y]="geometry().plotBottom + 24"
            text-anchor="middle"
          >
            {{ tick.label }}
          </text>
        }

        <text
          class="chart__axis-title"
          [attr.x]="geometry().plotLeft + (geometry().plotRight - geometry().plotLeft) / 2"
          [attr.y]="geometry().plotBottom + 44"
          text-anchor="middle"
        >
          Angle (°)
        </text>

        <g [attr.transform]="'rotate(-90 16 ' + geometry().axisCenter + ')'">
          <text
            class="chart__axis-title"
            x="16"
            [attr.y]="geometry().axisCenter"
            text-anchor="middle"
          >
            Torque (N·m)
          </text>
        </g>

        <path class="chart__area" [attr.d]="geometry().areaPath"></path>
        <path class="chart__line" [attr.d]="geometry().linePath"></path>

        @for (point of geometry().points; track $index) {
          <circle class="chart__dot" [attr.cx]="point.x" [attr.cy]="point.y" r="3.5"></circle>
        }
      </svg>
    </div>
  } @else {
    <div class="chart__empty">No torque-angle data available.</div>
  }
</article>

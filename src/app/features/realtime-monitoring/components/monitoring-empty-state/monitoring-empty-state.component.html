<div class="empty">
  <svg
    class="empty__art"
    viewBox="0 0 240 140"
    role="img"
    aria-label="Real-time data access illustration"
  >
    <defs>
      <pattern id="monitoring-grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#dbeafe" stroke-width="1"></path>
      </pattern>
    </defs>
    <rect width="240" height="140" rx="12" fill="#f8fbff"></rect>
    <rect width="240" height="140" rx="12" fill="url(#monitoring-grid)"></rect>
    <path
      d="M 34 104 C 66 104 62 84 90 84 S 128 60 158 58 S 184 48 200 44"
      fill="none"
      stroke="#60a5fa"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-dasharray="7 7"
    ></path>
    <circle cx="204" cy="42" r="12" fill="#2563eb" opacity="0.12"></circle>
    <circle cx="204" cy="42" r="5.5" fill="#2563eb"></circle>
  </svg>

  <p class="empty__eyebrow">Real-time data access</p>
  <h2 class="empty__title">Waiting for the first locked data</h2>
  <p class="empty__description">
    After the device is pushed, the judgment result and torque-angle curve<br />
    will be automatically displayed here.
  </p>

  <div class="empty__steps">
    <span class="step" [class.step--active]="serviceRunning()">
      <span class="step__number" aria-hidden="true">1</span>
      Local service operation
    </span>
    <span class="step" [class.step--active]="devicePushed()">
      <span class="step__number" aria-hidden="true">2</span>
      Device push data
    </span>
  </div>
</div>

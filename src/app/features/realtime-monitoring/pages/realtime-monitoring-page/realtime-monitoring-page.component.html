<section class="monitoring">
  <app-page-header
    title="Real-time Lock Monitoring"
    subtitle="Workstation status and judgment results are updated in real time."
  >
    <app-monitoring-status-badges
      [serviceStatus]="status()"
      [modelVersion]="activeModelVersion()"
    />
  </app-page-header>

  <div class="monitoring__card">
    @if (status() === 'error') {
      <div class="monitoring__error" role="alert">
        <p class="monitoring__error-title">{{ loadError() }}</p>
        <button type="button" class="monitoring__error-retry" (click)="retry()">Retry</button>
      </div>
    } @else if (monitoring.latestRecord(); as record) {
      <app-monitoring-live-result
        [record]="record"
        [recentRecords]="monitoring.recentRecords()"
        [activeVersion]="activeModelVersion()"
      />
    } @else {
      <app-monitoring-empty-state
        [serviceRunning]="serviceRunning()"
        [devicePushed]="devicePushed()"
        [activeVersion]="activeModelVersion()"
        [samplesByVersionList]="monitoring.samplesByVersionList()"
      />
    }
  </div>

  <app-monitoring-status-bar
    [isTimedOut]="barTimedOut()"
    [frequency]="monitoring.receiveFrequency()"
    [lastReceivedAt]="monitoring.lastReceivedAt()"
  />
</section>

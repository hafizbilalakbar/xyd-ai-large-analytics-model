<div
  class="progress"
  role="progressbar"
  aria-live="polite"
  [attr.aria-valuenow]="percent()"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-label]="'Import progress: ' + percent() + '%'">
  <div class="progress__header">
    <div>
      <div class="progress__file">{{ fileName() || 'Preparing...' }}</div>
      <div class="progress__stage">{{ stage() }}</div>
    </div>
    <div class="progress__time">{{ formattedElapsed() }}</div>
  </div>

  <div class="progress__bar-bg">
    <div class="progress__bar-fill" [style.width.%]="percent()"></div>
  </div>

  <ul class="progress__stages">
    @for (s of stages(); track s.key) {
      <li class="progress__stage-item" [class.progress__stage-item--active]="status() === s.key">
        @if (status() === s.key) {
          <span class="progress__spinner" aria-hidden="true"></span>
        } @else {
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12.5l4.5 4.5 9-9"></path>
          </svg>
        }
        <span>{{ s.label }}</span>
      </li>
    }
  </ul>

  <div class="progress__actions">
    <button type="button" class="btn btn-reset" (click)="cancel.emit()">Cancel import</button>
  </div>
</div>

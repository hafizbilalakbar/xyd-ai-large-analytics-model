<app-modal [open]="open()" title="Import Playback Data" (close)="onClose()">
  <div modalBody>
    @if (isImporting()) {
      <app-import-progress
        [fileName]="currentFileName()"
        [stage]="currentStage()"
        [percent]="progressPercent()"
        [elapsedMs]="importElapsedMs()"
        [status]="importStatus()"
        (cancel)="cancelImport.emit()">
      </app-import-progress>
    } @else {
      <div class="form-field">
        <label class="form-label">
          Batch number (shared by this batch)
          <span class="required">*</span>
        </label>
        @if (hasBatches()) {
          <select class="form-input" [value]="selectedBatchId()" (change)="onBatchChange($event)">
            <option value="">Please select the batch number.</option>
            @for (batch of batches(); track batch.id) {
              <option [value]="batch.id">{{ batch.name }}</option>
            }
          </select>
        } @else {
          <div class="form-input form-input--static">No batches available</div>
        }
      </div>

      <div class="form-field">
        <label class="form-label">
          Select file
          <span class="required">*</span>
        </label>
        <div
          class="file-picker"
          (dragover)="onDragOver($event)"
          (drop)="onDrop($event)"
          (click)="fileInput.click()">
          <input
            #fileInput
            type="file"
            class="file-picker__input"
            [accept]="acceptedTypes"
            multiple
            (change)="onFileSelect($event)" />
          <span class="file-picker__name">{{ fileName() }}</span>
          <button type="button" class="btn btn-query" (click)="fileInput.click(); $event.stopPropagation()">Select file</button>
        </div>
        <p class="form-helper">
          Accepted: ZIP (multiple curve files), CSV, TSV, TXT, XLSX, XLS, JSON. Maximum size {{ maxSizeText }} MB.
        </p>
        @if (validationError()) {
          <p class="form-error">{{ validationError() }}</p>
        }
      </div>

      <div class="template-link">
        <button type="button" class="link-button" (click)="downloadTemplate.emit()">Download Template</button>
      </div>
    }
  </div>
  @if (!isImporting()) {
    <div modalFooter>
      <button type="button" class="btn btn-reset" (click)="onClose()">Cancel</button>
      <button type="button" class="btn btn-query" [disabled]="!canConfirm()" (click)="onConfirm()">Confirm</button>
    </div>
  }
</app-modal>

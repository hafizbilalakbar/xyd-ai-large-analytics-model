<app-modal [open]="open()" title="Import Playback Data" (close)="onClose()">
  <div modalBody>
    @if (isImporting()) {
      <app-import-progress
        [fileName]="currentFileName()"
        [stage]="currentStage()"
        [percent]="progressPercent()"
        [elapsedMs]="importElapsedMs()"
        [status]="importStatus()"
        (cancel)="cancelImport.emit()">
      </app-import-progress>
    } @else {
      <div class="form-field">
        <label class="form-label">
          Batch number (shared by this batch)
          <span class="required">*</span>
        </label>
        @if (hasBatches()) {
          <select class="form-input" [value]="selectedBatchId()" (change)="onBatchChange($event)">
            <option value="">Please select the batch number.</option>
            @for (batch of batches(); track batch.id) {
              <option [value]="batch.id">{{ batch.name }}</option>
            }
          </select>
        } @else {
          <div class="form-input form-input--static">No batches available</div>
        }
      </div>

      <div class="form-field">
        <label class="form-label">
          Select file
          <span class="required">*</span>
        </label>
        @if (selectedFiles().length > 0) {
          <div class="file-info">
            <span class="file-name">{{ fileName() }}</span>
            <span class="file-size">{{ fileSize() }}</span>
            <button
              type="button"
              class="btn btn-reset btn--small file-remove"
              (click)="removeFile(); validationError.set('');"
              title="Remove file">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M3 6h18"></path>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        } @else {
          <div class="file-picker">
            <input
              #fileInput
              type="file"
              class="file-picker__input"
              [accept]="acceptedTypes"
              multiple
              (change)="onFileSelect($event)" />
            <button
              type="button"
              class="btn btn-query"
              (click)="fileInput.click(); $event.stopPropagation()">
              Select file
            </button>
          </div>
        }
        @if (validationError()) {
          <p class="form-error">{{ validationError() }}</p>
        }
      </div>

      <div class="template-link">
        <button type="button" class="link-button" (click)="downloadTemplate.emit()">Download Template</button>
      </div>
    }
  </div>
  @if (!isImporting()) {
    <div modalFooter>
      <button type="button" class="btn btn-reset" (click)="onClose()">Cancel</button>
      <button
        type="button"
        class="btn btn-query"
        [disabled]="!canConfirm() || isImporting()"
        (click)="onConfirm()">
        Confirm
      </button>
    </div>
  }
</app-modal>

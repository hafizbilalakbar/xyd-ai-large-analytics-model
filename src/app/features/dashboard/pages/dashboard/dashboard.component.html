<app-page-header
  title="Homepage Overview"
  subtitle="Real-time overview of locking quality, throughput, and platform health."
>
  <div class="page-header-actions">
    <span class="refresh-info">
      <span class="status-dot" aria-hidden="true"></span>
      Refreshes automatically every 60 seconds
    </span>
    <button
      type="button"
      class="btn-refresh"
      [disabled]="refreshing()"
      (click)="onRefresh()"
      [attr.aria-busy]="refreshing()"
      aria-label="Refresh data"
    >
      <app-icon class="btn-refresh__icon" name="refresh" [class.spin]="refreshing()" />
      <span class="btn-refresh__label">Refresh</span>
    </button>
    <span class="last-updated">Last updated: {{ lastUpdated() }}</span>
  </div>
</app-page-header>

<div class="dashboard">
  <div class="kpi-grid">
    @for (kpi of kpis(); track kpi.label) {
      <app-stat-card
        [loading]="loading()"
        [label]="kpi.label"
        [value]="kpi.value"
        [icon]="kpi.icon"
        [tone]="kpi.tone"
        [delta]="kpi.delta"
        [deltaDirection]="kpi.deltaDirection"
        [deltaTone]="kpi.deltaTone"
      />
    }
  </div>

  <div class="chart-grid">
    <app-hourly-trend-chart [points]="hourlyTrend()" [loading]="loading()" />
    <app-failure-mode-chart [modes]="failureModes()" [loading]="loading()" />
  </div>

  <app-recent-warning
    [alarms]="alarms()"
    [loading]="loading()"
    (markRead)="onAlarmMarkRead($event)"
    (remove)="onAlarmRemove($event)"
  />
</div>

<app-toast-container />

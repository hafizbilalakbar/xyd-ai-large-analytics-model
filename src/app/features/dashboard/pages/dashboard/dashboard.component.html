<section class="dashboard">
  <app-page-header
    title="Homepage Overview"
    description="Real-time overview of locking quality, throughput, and platform health."
  />

  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-4">
    @for (kpi of kpis(); track kpi.label) {
      <app-stat-card
        [label]="kpi.label"
        [value]="kpi.value"
        [icon]="kpi.icon"
        [tone]="kpi.tone"
        [delta]="kpi.delta"
        [deltaDirection]="kpi.deltaDirection"
        [deltaTone]="kpi.deltaTone"
      />
    }
  </div>

  <div class="grid grid-cols-1 gap-5 xl:grid-cols-3">
    <app-hourly-trend-chart class="xl:col-span-2" [points]="hourlyTrend()" />
    <app-failure-mode-chart [modes]="failureModes()" />
  </div>

  <app-system-monitoring-table [warnings]="warnings()" />
</section>

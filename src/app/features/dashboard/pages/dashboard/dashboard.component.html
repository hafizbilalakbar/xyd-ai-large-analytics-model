<app-page-header
  title="Homepage Overview"
  description="Real-time overview of locking quality, throughput, and platform health."
>
  <div class="page-header-actions">
    <span class="refresh-info">Refreshes automatically every 60 seconds</span>
    <button
      type="button"
      class="btn-refresh"
      [disabled]="refreshing()"
      (click)="onRefresh()"
      [attr.aria-busy]="refreshing()"
      aria-label="Refresh data"
    >
      <app-icon name="refresh" [class.spin]="refreshing()" />
      <span>{{ refreshing() ? 'Refreshing...' : 'Refresh' }}</span>
    </button>
    <span class="last-updated">Last updated: {{ lastUpdated() }}</span>
  </div>
</app-page-header>

<div class="dashboard">
  <div class="kpi-grid">
    @for (kpi of kpis(); track kpi.label) {
      <app-stat-card
        [loading]="loading()"
        [label]="kpi.label"
        [value]="displayValue(kpi)"
        [icon]="kpi.icon"
        [tone]="kpi.tone"
        [delta]="kpi.delta"
        [deltaDirection]="kpi.deltaDirection"
        [deltaTone]="kpi.deltaTone"
      />
    }
  </div>

  <div class="chart-grid">
    <app-hourly-trend-chart
      class="line-chart-card"
      [points]="hourlyTrend()"
      [loading]="loading()"
    />
    <app-failure-mode-chart [modes]="failureModes()" [loading]="loading()" />
  </div>

  <app-recent-warning
    [alarms]="alarms()"
    [loading]="loading()"
    (markRead)="onAlarmMarkRead($event)"
    (remove)="onAlarmRemove($event)"
  />
</div>

<article class="trend-card">
  <header class="trend-card__head">
    <div>
      <h2 class="trend-card__title">Real-time Lock-in Trends</h2>
      <p class="trend-card__subtitle">Hourly today</p>
    </div>
    <span class="trend-card__unit">Locked items</span>
  </header>

  <div class="trend-card__chart" #chartContainer style="width:100%;height:280px">
    <div class="echarts-container" style="width:100%;height:100%"></div>
    @if (loading()) {
      <div class="chart-loading-overlay">
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>
    }
  </div>
</article>

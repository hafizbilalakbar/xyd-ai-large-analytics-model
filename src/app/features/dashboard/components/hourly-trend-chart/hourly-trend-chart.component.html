<article class="trend-card">
  <header class="trend-card__head">
    <div>
      <h2 class="trend-card__title">Real-time Lock-in Trends</h2>
      <p class="trend-card__subtitle">Hourly today</p>
    </div>
    <span class="trend-card__unit">Locked items</span>
  </header>

  <div class="trend-card__chart" #chartContainer style="width:100%;height:280px">
    @if (loading()) {
      <div class="chart-skeleton">
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
      </div>
    } @else if (points().length === 0) {
      <div class="chart-empty">
        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 13l3-7h12l3 7"></path>
          <path d="M3 13v5a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-5h-5l-1.5 2h-5L8 13H3Z"></path>
        </svg>
        <span class="empty-text">No locked item data for today.</span>
      </div>
    } @else {
      <!-- ECharts draws directly into #chartContainer -->
    }
  </div>
</article>

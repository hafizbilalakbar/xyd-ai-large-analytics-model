<article class="failure-card">
  <header class="failure-card__head">
    <div>
      <h2 class="failure-card__title">Failure Mode Distribution</h2>
      <p class="failure-card__subtitle">Today</p>
    </div>
    <span class="failure-card__total">{{ total() }} failures</span>
  </header>

  @if (items().length > 0) {
    <ul class="failure-card__list">
      @for (mode of items(); track mode.label) {
        <li class="failure-mode">
          <div class="failure-mode__meta">
            <span class="failure-mode__label">{{ mode.label }}</span>
            <span class="failure-mode__value">{{ mode.count }} · {{ mode.share }}%</span>
          </div>
          <div class="failure-mode__track">
            <span
              class="failure-mode__bar"
              [attr.data-tone]="mode.tone"
              [style.width.%]="mode.share"
            ></span>
          </div>
        </li>
      }
    </ul>
  } @else {
    <div class="failure-card__empty">No failures recorded today.</div>
  }
</article>

<div class="app-shell">
  <app-header (toggleMobile)="openDrawer()" />

  <span class="app-shell__live" aria-live="polite">{{ announcement() }}</span>

  <div class="app-shell__body">
    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      [mode]="mode()"
      [drawerOpen]="drawerOpen()"
      [animate]="sidebarAnimated()"
      (toggleCollapse)="toggleSidebar()"
      (closeDrawer)="closeDrawer()"
    />

    @if (drawerOpen() && mode() !== 'desktop') {
      <button
        class="app-shell__scrim"
        type="button"
        aria-label="Close navigation"
        (click)="closeDrawer()"
      ></button>
    }

    <main class="app-shell__content">
      <router-outlet />
    </main>
  </div>
</div>

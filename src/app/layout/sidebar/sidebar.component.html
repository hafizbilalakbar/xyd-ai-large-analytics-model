<aside
  id="app-sidebar"
  class="sidebar"
  [class.sidebar--collapsed]="collapsed()"
  [class.sidebar--drawer-open]="drawerOpen()"
  [class.sidebar--mobile]="mode() === 'mobile'"
  [class.sidebar--tablet]="mode() === 'tablet'"
  [class.sidebar--animate]="animate()"
  [attr.aria-hidden]="mode() === 'mobile' && !drawerOpen() ? 'true' : null"
  [attr.inert]="mode() === 'mobile' && !drawerOpen() ? '' : null"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <div class="sidebar__head">
    <span class="sidebar__heading">Workspace</span>

    <div class="sidebar__tools">
      @if (mode() === 'mobile') {
        <button
          class="sidebar__tool sidebar__drawer-close"
          type="button"
          aria-label="Close menu"
          title="Close menu"
          (click)="closeDrawer.emit()"
        >
          <svg
            class="sidebar__glyph"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12" />
            <path d="M18 6 6 18" />
          </svg>
        </button>
      } @else {
        <button
          class="sidebar__tool sidebar__collapse"
          type="button"
          [attr.aria-label]="toggleLabel()"
          [attr.title]="toggleLabel()"
          [attr.aria-expanded]="!collapsed()"
          aria-controls="app-sidebar"
          (click)="toggleCollapse.emit()"
        >
          <span class="sidebar__collapse-icons">
            <svg
              class="sidebar__glyph sidebar__glyph--close"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M9 4v16" />
              <path d="m14.5 9-3 3 3 3" />
            </svg>
            <svg
              class="sidebar__glyph sidebar__glyph--open"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M9 4v16" />
              <path d="m12.5 9 3 3-3 3" />
            </svg>
          </span>
        </button>
      }
    </div>
  </div>

  <nav class="sidebar__nav" aria-label="Main navigation">
    @for (item of navigationItems; track item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        ariaCurrentWhenActive="page"
        [attr.title]="collapsed() ? null : item.label"
        (click)="onNavigate()"
        (mouseenter)="showItemTooltip(item.label, $event)"
        (mouseleave)="hideItemTooltip()"
        (focus)="showItemTooltip(item.label, $event)"
        (blur)="hideItemTooltip()"
      >
        <span class="nav-item__icon">
          <app-icon [name]="item.icon" />
        </span>
        <span class="nav-item__label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <footer class="sidebar__foot">
    <div class="sidebar__status">
      <span class="sidebar__status-dot" aria-hidden="true"></span>
      <div class="sidebar__status-copy">
        <span class="sidebar__status-label">{{ settings.statusLabel }}</span>
        <span class="sidebar__status-version">{{ settings.version }}</span>
      </div>
    </div>
  </footer>

  @if (tooltipLabel()) {
    <div
      class="rail-tooltip"
      role="tooltip"
      [style.top.px]="tooltipTop()"
      [style.left.px]="tooltipLeft()"
    >
      {{ tooltipLabel() }}
    </div>
  }
</aside>
